name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  # Job id must be exactly 'lint-and-test' — branch protection context is 'CI / lint-and-test'
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install ruff
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Lint with ruff
        run: ruff check . --output-format=github --select E,W,F --ignore E501

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest tests/ -v
          else
            echo "No tests/ directory found — skipping pytest (DEBT-01)"
          fi
