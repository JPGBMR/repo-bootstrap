name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  # Job id must be exactly 'analyze' — branch protection context is 'CI / analyze'
  analyze:
    # Must run on windows-latest — PSScriptAnalyzer requires Windows PowerShell context
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trust PSGallery
        shell: pwsh
        run: Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $results = Get-ChildItem -Recurse -Filter *.ps1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning, Error }

          $results | Format-Table -AutoSize

          if ($results | Where-Object { $_.Severity -eq 'Error' }) {
            Write-Host "PSScriptAnalyzer errors found — failing build"
            exit 1
          }

          Write-Host "PSScriptAnalyzer: no errors found."
